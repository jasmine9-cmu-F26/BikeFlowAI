services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PPO: ${BIKEFLOW_INSTALL_PPO:-false}
    environment:
      BIKEFLOW_MOUNTED_DATA_ROOT: /data
      BIKEFLOW_LIVE: ${BIKEFLOW_LIVE:-1}
    volumes:
      - ${BIKEFLOW_DATA_ROOT:-./demo-data}:/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
